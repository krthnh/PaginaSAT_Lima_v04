<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pagos en Línea - SAT Lima</title>
    <link rel="stylesheet" href="css/ReclamosTributarios.css">
    <link rel="stylesheet" href="css/pasarela.css">
</head>
<body>
    <div class="pasarela-container">
        <div class="pasarela-header">
            <h2>Pasarela de Pagos SAT</h2>
            <p>Complete su pago en línea de forma rápida y segura</p>
        </div>

        <div class="resumen-cobro">
            <div><strong>Código de Reclamo:</strong> <span id="resumen-codigo">---</span></div>
            <div><strong>Total a Pagar:</strong> <span id="resumen-monto" class="monto-destacado">S/ 0.00</span></div>
        </div>

        <!-- Selección del Medio de Pago -->
        <div class="metodo-pago-selector">
            <label class="metodo-option">
                <input type="radio" name="medio_pago" value="tarjeta" checked id="radio-tarjeta">
                <span>Tarjeta de Crédito / Débito</span>
            </label>
            <label class="metodo-option">
                <input type="radio" name="medio_pago" value="billetera" id="radio-billetera">
                <span>Billeteras Digitales (Yape / Plin)</span>
            </label>
        </div>

        <!-- FORMULARIO TARJETA DE CRÉDITO / DÉBITO -->
        <form id="form-pago-tarjeta" class="form-metodo active">
            <div class="form-group">
                <label for="tarjeta-marca">Marca de Tarjeta</label>
                <select id="tarjeta-marca" class="form-control" required>
                    <option value="Visa">Visa</option>
                    <option value="Mastercard">Mastercard</option>
                    <option value="AmericanExpress">American Express</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tarjeta-numero">Número de Tarjeta (16 dígitos)</label>
                <input type="text" id="tarjeta-numero" maxlength="16" placeholder="4557 0000 0000 0000" required>
            </div>

            <div class="form-group">
                <label for="tarjeta-titular">Nombre Completo del Titular</label>
                <input type="text" id="tarjeta-titular" placeholder="Ej. CLAUDIA ROJAS" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tarjeta-dni">DNI del Titular</label>
                    <input type="text" id="tarjeta-dni" maxlength="8" placeholder="85214796" required>
                </div>
                <div class="form-group">
                    <label for="tarjeta-tipo">Tipo de Tarjeta</label>
                    <select id="tarjeta-tipo" class="form-control" required>
                        <option value="Debito">Débito</option>
                        <option value="Credito">Crédito</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tarjeta-mes">Mes Exp. (MM)</label>
                    <input type="text" id="tarjeta-mes" maxlength="2" placeholder="12" required>
                </div>
                <div class="form-group">
                    <label for="tarjeta-anio">Año Exp. (AA)</label>
                    <input type="text" id="tarjeta-anio" maxlength="2" placeholder="28" required>
                </div>
                <div class="form-group" id="grupo-cuotas" style="display: none;">
    <label for="tarjeta-cuotas">N° Cuotas</label>
    <input type="number" id="tarjeta-cuotas" min="1" max="36" value="1" placeholder="Ej. 6">
</div>
            </div>

            <button type="submit" class="btn-pagar">Pagar con Tarjeta</button>
        </form>

        <!-- FORMULARIO BILLETERA DIGITAL (YAPE / PLIN) -->
        <form id="form-pago-billetera" class="form-metodo" style="display: none;">
            <div class="form-group">
                <label for="billetera-tipo">Seleccionar Billetera</label>
                <select id="billetera-tipo" class="form-control" required>
                    <option value="YAPE">Yape</option>
                    <option value="PLIN">Plin</option>
                </select>
            </div>
            <div class="form-group">
                <label for="billetera-celular">Número Celular Registrado (9 dígitos)</label>
                <input type="text" id="billetera-celular" maxlength="9" placeholder="956232458" required>
            </div>
            <button type="submit" class="btn-pagar">Autorizar y Pagar</button>
        </form>

        <div id="pago-mensaje" class="mensaje-alerta" style="display: none;"></div>
    </div>

    <script type="module" src="js/pasarela.js"></script>
</body>
</html>
